AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository for Tutorial 07 Random Quotes image.

Resources:
  RandomQuotesRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: randomquotes
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the five most recently pushed images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryName:
    Description: ECR repository name.
    Value: !Ref RandomQuotesRepository
  RepositoryUri:
    Description: Full ECR URI used by ECS task definitions.
    Value: !GetAtt RandomQuotesRepository.RepositoryUri
